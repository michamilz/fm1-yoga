# The yoga firmware's build settings (fm1-base's tools/build.py: ./build.sh)
name = "YOGA"                  # the build's files: yoga.fwsc
id_prefix = "FM-1_432"         # package identity (432 Hz): dev FM-1_43200, releases FM-1_432XXYYZZ (1.0: FM-1_432010000)
usb_manufacturer = "FM1 YOGA"
usb_product = "YOGA FM-1"
ble = false                    # no radio
usb_audio_in = true            # the sound recordable over USB
usb_audio_out = true           # a computer may play through the FM-1 (music for the class)
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine (AMB-1's garden with the yoga layer inside), at -O2
# the site
tagline = "Klänge für die Endentspannung"
repo = "https://github.com/michamilz/fm1-yoga"
licence = "MPL-2.0"
credits = "Built on AMB-1 by Charles Vestal and fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Huegelton Instruments)."
# firmware.json (base/docs/FIRMWARE-JSON.md): what the hubs show
author = "Michael Milz"
description = "A sound companion for the final relaxation of a yoga class. Guided programs on 174, 396, 432 and 528 Hz drift from theta to delta, isochronic for speakers or binaural for headphones, with breath, singing bowls and an ambient garden, then wake you gently. Play handpan, kalimba or chimes on the keys, or loop them with the sequencer."
tags = ["ambient", "generative", "sequencer"]
install = "https://michamilz.github.io/fm1-yoga/install/"
site = "https://michamilz.github.io/fm1-yoga/"
screenshot = "docs/img/hub-240.png"
